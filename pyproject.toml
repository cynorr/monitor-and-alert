[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longbridge-data-service"
version = "0.1.0"
description = "Local, whitelist-only Longbridge quote and closed-bar service"
requires-python = ">=3.11"
dependencies = ["longbridge==5.0.0", "exchange-calendars==4.13.2", "aiohttp>=3.11,<4", "watchdog>=6,<7", "numpy>=2,<3", "pandas>=2.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
macos = ["pyobjc-framework-Cocoa>=12.2,<13; sys_platform == 'darwin'", "pyobjc-framework-UserNotifications>=12.2,<13; sys_platform == 'darwin'", "py2app>=0.28.10,<1; sys_platform == 'darwin'", "setuptools>=75,<81; sys_platform == 'darwin'"]

[project.scripts]
longbridge-data = "data_service.__main__:main"

[tool.setuptools.packages.find]
include = ["data_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
