<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Charts</title><link rel="stylesheet" href="/style.css">
  <script src="/vendor/lightweight-charts/5.2.0/lightweight-charts.standalone.production.js"></script>
  <script type="module" src="/main.js"></script>
</head>
<body>
<main id="workspace" class="workspace" aria-label="Charts and watchlist">
  <article class="chart-panel" id="daily-panel" aria-label="Daily chart">
    <div class="chart-header">
      <div class="chart-toolbar"><strong class="symbol">—</strong><span class="period">Daily</span><button id="daily-latest" class="latest" aria-label="Daily: go to latest" title="Go to latest">↦</button></div>
      <div class="spread" hidden><span class="bid"></span><span class="ask"></span></div>
      <div class="metrics"><span>ADR20 <b class="adr">—</b></span><span>ADV20 <b class="adv">—</b></span></div>
      <div class="header-bottom"><div id="daily-legend" class="legend"><span class="ema10" title="EMA10" aria-label="EMA10"></span><span class="ema20" title="EMA20" aria-label="EMA20"></span><span class="sma50" title="SMA50" aria-label="SMA50"></span></div><span id="daily-state" class="state" role="status"></span><span class="quality" tabindex="0" hidden aria-label="Data warning">!</span></div>
    </div>
    <div id="daily-ohlc" class="ohlc">—</div>
    <div class="chart-host" id="daily-chart"><div class="volume-label" id="daily-volume">V —</div></div><div class="chart-empty" id="daily-empty">Loading</div>
  </article>
  <div class="divider" id="divider-0" role="separator" aria-orientation="vertical" aria-label="Resize Daily and Intraday" tabindex="0"></div>
  <article class="chart-panel" id="intraday-panel" aria-label="Intraday chart">
    <div class="chart-header">
      <div class="chart-toolbar"><strong class="last-price">—</strong><time class="clock"></time><button id="intraday-latest" class="latest" aria-label="Intraday: go to latest" title="Go to latest">↦</button></div>
      <div class="period-row"><div class="timeframes" role="group" aria-label="Intraday period"><button data-tf="5m" class="active" aria-pressed="true">5m</button><button data-tf="15m" aria-pressed="false">15m</button><button data-tf="30m" aria-pressed="false">30m</button><button data-tf="1h" aria-pressed="false">1h</button><button data-tf="2h" aria-pressed="false">2h</button><button data-tf="4h" aria-pressed="false">4h</button></div><span class="session pill" hidden></span></div>
      <div class="spread" hidden><span class="bid"></span><span class="ask"></span></div>
      <div class="header-bottom"><div id="intraday-legend" class="legend"><span class="ema10" title="EMA10" aria-label="EMA10"></span><span class="ema20" title="EMA20" aria-label="EMA20"></span><span class="sma65" title="SMA65" aria-label="SMA65"></span></div><span id="intraday-state" class="state" role="status"></span><span class="quality" tabindex="0" hidden aria-label="Data warning">!</span></div>
    </div>
    <div id="intraday-ohlc" class="ohlc">—</div>
    <div class="chart-host" id="intraday-chart"><div class="volume-label" id="intraday-volume">V —</div></div><div class="chart-empty" id="intraday-empty">Loading</div>
  </article>
  <div class="divider" id="divider-1" role="separator" aria-orientation="vertical" aria-label="Resize Intraday and watchlist" tabindex="0"></div>
  <aside class="watchlist" aria-label="Watchlist">
    <div class="list-heading"><strong>Watchlist</strong><span id="symbol-count"></span><span id="simulation" class="pill" hidden title="Synthetic data. No broker connection.">SIM</span></div>
    <input id="search" type="search" placeholder="Search" aria-label="Search symbols" autocomplete="off">
    <div class="list-columns"><span>Symbol</span><span>Last</span><span>Chg%</span><span>Ext</span></div>
    <nav id="symbols" aria-label="Symbols"></nav>
  </aside>
</main>
</body></html>
